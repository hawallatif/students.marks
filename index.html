'use strict';
/* ===== ئۆنلاین: ناونیشانی Web App ـی Google Apps Script لێرە دابنێ =====
   ئەگەر بەتاڵ بێت، سیستەمەکە وەک پێشوو بە شێوەی ئۆفلاین (لەسەر ئامێرەکە) کار دەکات. */
const API_URL='https://script.google.com/macros/s/AKfycbxY1bjYMnIHGx6Bwi-YQtdA7GBKmlOBJhyq43rVZOTd0DJCwlWpC7CzWBIBYwA6Ej-q/exec';
const ONLINE=/^https?:\/\//.test(API_URL);
/* ================= SHA-256 (بۆ پاسۆرد) ================= */
function sha256(ascii){
  function rr(v,a){return (v>>>a)|(v<<(32-a));}
  var mp=Math.pow,mw=mp(2,32),i,j,result='',words=[],abl=ascii.length*8;
  var hash=sha256.h=sha256.h||[],k=sha256.k=sha256.k||[],pc=k.length,isc={};
  for(var c=2;pc<64;c++){
    if(!isc[c]){
      for(i=0;i<313;i+=c)isc[i]=c;
      hash[pc]=(mp(c,.5)*mw)|0;
      k[pc++]=(mp(c,1/3)*mw)|0;
    }
  }
  ascii+='\x80';
  while(ascii.length%64-56)ascii+='\x00';
  for(i=0;i<ascii.length;i++){
    j=ascii.charCodeAt(i);
    if(j>>8)return '';
    words[i>>2]|=j<<((3-i)%4)*8;
  }
  words[words.length]=((abl/mw)|0);
  words[words.length]=(abl);
  for(j=0;j<words.length;){
    var w=words.slice(j,j+=16),old=hash;
    hash=hash.slice(0,8);
    for(i=0;i<64;i++){
      var w15=w[i-15],w2=w[i-2],a=hash[0],e=hash[4];
      var t1=hash[7]+(rr(e,6)^rr(e,11)^rr(e,25))+((e&hash[5])^((~e)&hash[6]))+k[i]+
        (w[i]=(i<16)?w[i]:(w[i-16]+(rr(w15,7)^rr(w15,18)^(w15>>>3))+w[i-7]+(rr(w2,17)^rr(w2,19)^(w2>>>10)))|0);
      var t2=(rr(a,2)^rr(a,13)^rr(a,22))+((a&hash[1])^(a&hash[2])^(hash[1]&hash[2]));
      hash=[(t1+t2)|0].concat(hash);
      hash[4]=(hash[4]+t1)|0;
    }
    for(i=0;i<8;i++)hash[i]=(hash[i]+old[i])|0;
  }
  for(i=0;i<8;i++)for(j=3;j+1;j--){var b=(hash[i]>>(j*8))&255;result+=((b<16)?0:'')+b.toString(16);}
  return result;
}
const utf8=s=>unescape(encodeURIComponent(s));
const H=s=>sha256(utf8('nurs-att|'+s));

/* ================= یاریدەدەرەکان ================= */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-4);
const pad=n=>String(n).padStart(2,'0');
const today=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const DAYS=['یەکشەممە','دووشەممە','سێشەممە','چوارشەممە','پێنجشەممە','هەینی','شەممە'];
const dayName=d=>d?DAYS[new Date(d+'T00:00:00').getDay()]:'';
const STAGE=['','یەکەم','دووەم','سێیەم','چوارەم','پێنجەم','شەشەم'];
const stageName=n=>'قۆناغی '+(STAGE[n]||n);
const STL={ok:'ئاسایی',warn:'ئاگادارکراوەتەوە',fail:'کەوتوو'};
const typeName=t=>t==='theory'?'تیۆری':'پراکتیکی';
const coll=new Intl.Collator('ckb');
const byName=(a,b)=>coll.compare(a.name,b.name);
const rk=r=>r.courseId+'|'+(r.group||'')+'|'+r.date;
const randPw=()=>{const s='abcdefghjkmnpqrstuvwxyz23456789';let o='';for(let i=0;i<7;i++)o+=s[Math.floor(Math.random()*s.length)];return o};
function toast(m,bad){const t=$('#toast');t.textContent=m;t.className='show'+(bad?' bad':'');clearTimeout(toast.t);toast.t=setTimeout(()=>{t.className=''},2800)}
function download(name,text,mime){const b=new Blob([text],{type:mime||'text/plain;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},600)}
const toCSV=rows=>'\ufeff'+rows.map(r=>r.map(v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"').join(',')).join('\r\n');
function modal(html){$('#modal').innerHTML='<div class="ov" data-act="closeM"><div class="mod">'+html+'<div class="mfoot"><button class="btn" data-act="closeM">داخستن</button></div></div></div>'}
function formModal(title,fields,cb){
  UI.mcb=cb;
  modal('<h3>'+esc(title)+'</h3><form data-form="mform">'+fields.map(f=>'<label>'+esc(f.label)+(f.type==='select'
    ?'<select name="'+f.k+'">'+f.options.map(o=>'<option value="'+esc(o[0])+'"'+(String(o[0])===String(f.value)?' selected':'')+'>'+esc(o[1])+'</option>').join('')+'</select>'
    :'<input name="'+f.k+'" type="'+(f.type||'text')+'" value="'+esc(f.value)+'"'+(f.req?' required':'')+'>')+'</label>').join('')+'<button class="btn pri block">پاشەکەوتکردن</button></form>');
}

/* ================= داتا ================= */
const KEY='nursing_attendance_v1';
const baseDB=()=>({v:1,cfgStamp:0,epoch:0,settings:{college:'کۆلێجی تەکنیکی کەلار',title:'بەشی پەرستاری',pct:3,warn:3,fail:4,stages:4},admin:null,teachers:[],students:[],courses:[],records:[],grades:[]});
function freshDB(){const d=baseDB();d.admin={username:'admin',pw:'cb90ff4862b8cd6e250d612464931a44f2ee76b5944215f1f21cd939a766c0cc'};return d}
function loadLS(){try{const t=localStorage.getItem(KEY);return t?JSON.parse(t):null}catch(e){return null}}
let DB,SESSION=null,STUDENT_ONLY=false;
const UI={gr:null,gsm:{stage:'',course:'',q:'',from:'',to:''},tab:'home',att:null,rep:{stage:'',course:'',status:'',q:'',from:'',to:'',sort:'course'},cf:null,sf:{stage:'',q:''},sess:{course:''},gs:null,gmsg:'',mcb:null,md:null,fn:{stage:'',course:'',q:''},cfgOpen:false};
function save(){
  if(STUDENT_ONLY)return;
  if(ONLINE){
    if(SESSION&&SESSION.role!=='guest'){
      try{localStorage.setItem(KEY2,JSON.stringify(DB))}catch(e){}
      if(!QUIET){CHG_N++;PENDING=true;pushSoon()}
    }
    return;
  }
  try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){toast('نەتوانرا لە وێبگەڕەکەدا پاشەکەوت بکرێت',true)}
}
function cfg(){DB.cfgStamp=Date.now();save()}
const status=a=>a>=DB.settings.fail?'fail':a>=DB.settings.warn?'warn':'ok';
const getCourse=id=>DB.courses.find(c=>c.id===id);
const getTeacher=id=>DB.teachers.find(t=>t.id===id);
const isAdmin=()=>SESSION&&SESSION.role==='admin';
const isDefaultAdmin=()=>DB.admin&&DB.admin.username==='admin'&&DB.admin.pw==='cb90ff4862b8cd6e250d612464931a44f2ee76b5944215f1f21cd939a766c0cc';

function mergeIn(inc){
  const st={added:0,updated:0,cfg:false};
  if(!DB.admin&&(inc.cfgStamp||0)>(DB.cfgStamp||0)){
    ['settings','teachers','students','courses'].forEach(k=>{if(inc[k])DB[k]=inc[k]});
    DB.cfgStamp=inc.cfgStamp;st.cfg=true;
  }
  const ie=inc.epoch||0;
  if(ie>DB.epoch){DB.records=(inc.records||[]).slice();DB.epoch=ie;DB.grades=(inc.grades||[]).slice();st.added=DB.records.length}
  else if(ie===DB.epoch){
    const m=new Map(DB.records.map(r=>[rk(r),r]));
    (inc.records||[]).forEach(r=>{const o=m.get(rk(r));if(!o){m.set(rk(r),r);st.added++}else if((r.savedAt||0)>(o.savedAt||0)){m.set(rk(r),r);st.updated++}});
    DB.records=[...m.values()];
    DB.grades=DB.grades||[];
    const gm=new Map(DB.grades.map(g=>[gk(g),g]));
    (inc.grades||[]).forEach(g=>{const o=gm.get(gk(g));if(!o){gm.set(gk(g),g);st.added++}else if((g.savedAt||0)>(o.savedAt||0)){gm.set(gk(g),g);st.updated++}});
    DB.grades=[...gm.values()];
  }
  save();return st;
}

/* ================= حیسابات ================= */
function absIndex(from,to){
  const ix={};
  DB.records.forEach(r=>{
    if(from&&r.date<from)return;if(to&&r.date>to)return;
    (r.absent||[]).forEach(sid=>{(ix[r.courseId+'|'+sid]=ix[r.courseId+'|'+sid]||[]).push({d:r.date,g:r.group})});
  });
  return ix;
}
function myCourses(){
  let l=DB.courses;
  if(!isAdmin())l=l.filter(c=>c.type==='theory'?c.teacherId===SESSION.id:Object.values(c.groupTeachers||{}).includes(SESSION.id));
  return l.slice().sort((a,b)=>a.stage-b.stage||byName(a,b));
}
function myGroups(c){
  const gt=c.groupTeachers||{};
  return Object.keys(gt).filter(g=>gt[g]&&(isAdmin()||gt[g]===SESSION.id)).sort(coll.compare);
}
function courseStudents(c,g){
  let l=DB.students.filter(s=>String(s.stage)===String(c.stage));
  if(c.type==='practical'){const gs=g?[g]:myGroups(c);l=l.filter(s=>gs.includes(s.group))}
  return l.sort(byName);
}
function teacherOf(c,g){
  const id=c.type==='theory'?c.teacherId:(c.groupTeachers||{})[g];
  const t=getTeacher(id);return t?t.name:'—';
}
function groupsOfStage(stage){return [...new Set(DB.students.filter(s=>String(s.stage)===String(stage)&&s.group).map(s=>s.group))].sort(coll.compare)}
function computeRows(f){
  const ix=absIndex(f.from,f.to),S=DB.settings,out=[],q=(f.q||'').trim().toLowerCase();
  myCourses().forEach(c=>{
    if(f.stage&&String(c.stage)!==String(f.stage))return;
    if(f.course&&c.id!==f.course)return;
    courseStudents(c,null).forEach(s=>{
      if(q&&!(s.name.toLowerCase().includes(q)||String(s.code).toLowerCase().includes(q)))return;
      const dates=(ix[c.id+'|'+s.id]||[]).map(x=>x.d).sort(),a=dates.length,st=status(a);
      if(f.status&&f.status!==st)return;
      out.push({s,c,a,pct:a*S.pct,st,dates});
    });
  });
  if(f.sort==='abs')out.sort((x,y)=>y.a-x.a||byName(x.s,y.s));
  else if(f.sort==='name')out.sort((x,y)=>byName(x.s,y.s)||byName(x.c,y.c));
  return out;
}

function loginView(){
  return header()+'<main class="wrap narrow"><div class="grid2">'+
  '<section class="card"><h2>🔐 چوونەژوورەوە</h2><p class="mut" style="margin-top:0">بۆ سەرۆکی بەش و مامۆستایان</p>'+
  '<form data-form="login"><label>ناوی بەکارهێنەر<input name="u" autocomplete="username" required dir="ltr"></label>'+
  '<label>پاسۆرد<input name="p" type="password" autocomplete="current-password" required dir="ltr"></label>'+
  '<button class="btn pri block">چوونەژوورەوە</button></form>'+
  (isDefaultAdmin()?'<div class="hint">پاسۆردی سەرەتایی هێشتا نەگۆڕدراوە — دوای چوونەژوورەوە بیگۆڕە</div>':'')+'</section>'+

function studentReport(s){
  const ix=absIndex(),S=DB.settings,gx=gradeStats();
  const cs=DB.courses.filter(c=>String(c.stage)===String(s.stage)&&(c.type==='theory'||(c.groupTeachers||{})[s.group])).sort(byName);
  const cards=cs.map(c=>{
    const arr=(ix[c.id+'|'+s.id]||[]).map(x=>x.d).sort(),a=arr.length,st=status(a);
    let msg='';
    if(st==='fail')msg='بەهۆی '+a+' غیاب ('+a*S.pct+'%) لەم وانەیە کەوتوویت.';
    else if(st==='warn')msg='ئاگاداری! '+a+' غیابت هەیە — بە '+S.fail+' غیاب دەکەویت.';
    return '<div class="scard '+st+'"><div class="sh"><b>'+esc(c.name)+'</b><small class="mut">'+typeName(c.type)+'</small><span class="badge '+st+'">'+STL[st]+'</span></div>'+
    '<div class="big">'+a*S.pct+'%</div><div class="mut">'+a+' غیاب (هەر غیابێک = '+S.pct+'%)</div>'+
    '<div class="bar"><i style="width:'+Math.min(100,a/S.fail*100)+'%"></i></div>'+(msg?'<p class="msg">'+msg+'</p>':'')+
    (arr.length?'<div class="dts">بەرواری غیابەکان: '+arr.map(d=>'<span>'+d+'</span>').join('')+'</div>':'')+
    '<div class="gbox">'+GT.map(t=>{const a=(gx[c.id+'|'+s.id]||{})[t[0]];return '<div class="gb"><span class="mut">'+t[1]+' (mean)</span><b>'+(a?num(meanOf(a)):'—')+'</b>'+(a?'<small>'+a.length+' نمرە: '+a.map(x=>num(x.v)).join('، ')+'</small>':'')+'</div>'}).join('')+'</div></div>';
  }).join('');
  return '<section class="card"><h3>'+esc(s.name)+'</h3><div class="mut">'+stageName(s.stage)+(s.group?' — گروپ '+esc(s.group):'')+'</div></section>'+(cards||'<div class="card empty">هێشتا هیچ وانەیەک بۆ ئەم قۆناغە دیاری نەکراوە.</div>');
}

function attendBody(){
  const courses=myCourses();

  const A=UI.att=UI.att||{courseId:'',group:'',date:today(),absent:new Set(),loaded:false,key:null,dirty:false};
  if(!courses.some(c=>c.id===A.courseId)){A.courseId=courses[0].id;A.group=''}

  if(c.type==='practical'){groups=myGroups(c);if(!groups.includes(A.group))A.group=groups[0]||''}else A.group='';

  '<div class="hint">لەسەر ناوی خوێندکار یان دوگمەکە کلیک بکە بۆ گۆڕینی «ئامادە / غایب». پاشان پاشەکەوت بکە.</div></div>'+
  '<div class="card tbl"><table><thead><tr><th>#</th><th>ناوی خوێندکار</th><th>کۆد</th><th>کۆی غیاب (لەگەڵ ئەم ڕۆژە)</th><th>دۆخ</th></tr></thead><tbody id="att-body">'+

}

const GT=[['seminar','سیمینار'],['quiz','کویز'],['assignment','ئەسایمێنت'],['report','ڕاپۆرت']];
const gtName=k=>(GT.find(x=>x[0]===k)||['',k])[1];
const gk=g=>g.courseId+'|'+g.sid+'|'+g.type+'|'+g.date;

const meanOf=a=>a&&a.length?a.reduce((t,x)=>t+x.v,0)/a.length:null;
function gradeStats(from,to){
  const ix={};
  liveGrades().forEach(g=>{
    if(from&&g.date<from)return;if(to&&g.date>to)return;
    const k=g.courseId+'|'+g.sid,o=ix[k]=ix[k]||{};
    (o[g.type]=o[g.type]||[]).push({d:g.date,v:g.score});
  });
  return ix;
}
function gMeanText(sid){
  const G=UI.gr,a=(G.prev[sid]||[]).slice(),raw=G.vals[sid],v=parseFloat(raw);
  if(raw!==undefined&&raw!==''&&!isNaN(v))a.push(v);
  return a.length?num(a.reduce((t,x)=>t+x,0)/a.length)+' ('+a.length+' نمرە)':'—';
}

function gradesBody(){
  const courses=myCourses();
  if(!courses.length)return '<div class="card empty">'+(isAdmin()?'هیچ وانەیەک تۆمار نەکراوە. سەرەتا لە بەشی «وانەکان» وانە زیاد بکە.':'هیچ وانەیەکت بۆ دیاری نەکراوە. داوا لە سەرۆکی بەش بکە وانەکانت بۆ دیاری بکات.')+'</div>';
  const G=UI.gr=UI.gr||{courseId:'',group:'',type:'quiz',date:today(),vals:{},key:null,dirty:false};
  if(!courses.some(c=>c.id===G.courseId)){G.courseId=courses[0].id;G.group=''}
  const c=getCourse(G.courseId);let groups=[];
  if(c.type==='practical'){groups=myGroups(c);if(!groups.includes(G.group))G.group=groups[0]||''}else G.group='';
  const list=c.type==='practical'&&!G.group?[]:courseStudents(c,G.group||null);
  const key=[G.courseId,G.group,G.type,G.date].join('|');
  const cur={};
  liveGrades().forEach(g=>{if(g.courseId===c.id&&g.type===G.type&&g.date===G.date)cur[g.sid]=g});
  if(G.key!==key){G.vals={};list.forEach(s=>{if(cur[s.id])G.vals[s.id]=String(cur[s.id].score)});G.key=key;G.dirty=false}
  G.list=list;G.prev={};
  liveGrades().forEach(g=>{if(g.courseId===c.id&&g.type===G.type&&g.date!==G.date)(G.prev[g.sid]=G.prev[g.sid]||[]).push(g.score)});
  const loaded=Object.keys(cur).length>0;
  return '<div class="datebar"><span class="dl">📅 بەرواری نمرە</span><input type="date" id="gr-date" data-chg="gr" value="'+G.date+'"><span class="dn">'+dayName(G.date)+'</span>'+(loaded?'<span class="tag">پێشتر تۆمارکراوە — دەتوانیت دەستکاری بکەیت</span>':'')+'</div>'+

  (c.type==='practical'?'<label>گروپ<select id="gr-group" data-chg="gr">'+groups.map(g=>'<option'+(g===G.group?' selected':'')+' value="'+esc(g)+'">'+esc(g)+'</option>').join('')+'</select></label>':'')+
  '<label>جۆری نمرە<select id="gr-type" data-chg="gr">'+GT.map(t=>'<option value="'+t[0]+'"'+(t[0]===G.type?' selected':'')+'>'+t[1]+'</option>').join('')+'</select></label></div>'+
  '<div class="chips"><span class="chip">کۆی خوێندکار: <b>'+list.length+'</b></span><span class="chip ok">'+gtName(G.type)+'</span><span class="chip">'+(c.type==='theory'?'تیۆری — '+stageName(c.stage):'پراکتیکی — گروپ '+esc(G.group))+'</span></div>'+

  '<div class="card tbl"><table><thead><tr><th>#</th><th>ناوی خوێندکار</th><th>کۆد</th><th>نمرە</th><th>پێشتر</th><th>mean (لەگەڵ ئەم نمرەیە)</th></tr></thead><tbody>'+
  (list.map(gRow).join('')||'<tr><td colspan="6" class="empty">هیچ خوێندکارێک نییە'+(c.type==='practical'&&!groups.length?' — هیچ گروپێک بۆ ئەم وانەیە دیاری نەکراوە':'')+'</td></tr>')+'</tbody></table></div>';
}

function gsumRows(f){
  const ix=gradeStats(f.from,f.to),q=(f.q||'').trim().toLowerCase(),out=[];
  myCourses().forEach(c=>{
    if(f.stage&&String(c.stage)!==String(f.stage))return;
    if(f.course&&c.id!==f.course)return;
    courseStudents(c,null).forEach(s=>{
      if(q&&!(s.name.toLowerCase().includes(q)||String(s.code).toLowerCase().includes(q)))return;
      out.push({s,c,o:ix[c.id+'|'+s.id]||{}});
    });
  });
  return out;
}

ACTS.saveGr=()=>{
  const G=UI.gr,c=getCourse(G.courseId);if(!c)return;
  if(!G.list.length){toast('هیچ خوێندکارێک نییە بۆ پاشەکەوتکردن',true);return}
  if(G.date>today()&&!isAdmin()){toast('ناتوانرێت نمرە بۆ ڕۆژی داهاتوو تۆمار بکرێت',true);return}
  DB.grades=DB.grades||[];
  const ops=[];let bad=0;
  G.list.forEach(s=>{
    const raw=String(G.vals[s.id]==null?'':G.vals[s.id]).trim().replace(',','.');
    const g0={courseId:c.id,sid:s.id,type:G.type,date:G.date};
    const i=DB.grades.findIndex(x=>gk(x)===gk(g0));
    if(raw===''){if(i>=0&&DB.grades[i].score!=null)ops.push({i,g0,score:null});return}
    const v=Number(raw);
    if(!isFinite(v)||v<0){bad++;return}
    ops.push({i,g0,score:v});
  });
  if(bad){toast('نمرەیەک دروست نییە — تەنها ژمارە بنووسە',true);return}
  const now=Date.now();let n=0;
  ops.forEach(o=>{
    if(o.score!=null)n++;
    if(o.i>=0){const g=DB.grades[o.i];g.score=o.score;g.savedBy=SESSION.name;g.savedAt=now}
    else DB.grades.push(Object.assign({id:uid(),score:o.score,savedBy:SESSION.name,savedAt:now},o.g0));
  });
  save();G.dirty=false;toast('نمرەکان پاشەکەوت کران ✓ ('+n+' نمرە)');render();
};

FORMS.student=f=>{

FORMS.bulk=f=>{
  const def=+f.elements.stage.value;let add=0,upd=0,auto=0;
  f.elements.t.value.split(/\r?\n/).forEach(line=>{
    line=line.trim();if(!line)return;
    const p=line.split(/\t|,|،|;|\|/).map(x=>x.trim());
    let code,name,stage=def,group='';
    if(p.length===1){name=p[0]}else{code=p[0];name=p[1];if(p[2]&&stageOK(parseInt(p[2])))stage=parseInt(p[2]);group=p[3]||''}
    if(!name)return;
    if(!code){do{auto++;code=stage+String(auto).padStart(3,'0')}while(DB.students.some(s=>String(s.code)===code))}
    const ex=DB.students.find(s=>String(s.code)===code);
    if(ex){ex.name=name;ex.stage=stage;if(group)ex.group=group;upd++}else{DB.students.push({id:uid(),code,name,stage,group});add++}
  });
  cfg();toast(add+' زیادکرا، '+upd+' نوێکرایەوە');render();
};

  ACTS.exBackup();DB.records=[];DB.grades=[];DB.epoch++;UI.att=null;save();toast('وەرزی نوێ دەستی پێکرد ✓');render();

$('#impf').addEventListener('change',e=>{
  const file=e.target.files[0];e.target.value='';if(!file)return;
  const rd=new FileReader();
  rd.onload=()=>{
    try{
      const inc=JSON.parse(rd.result);if(!Array.isArray(inc.records))throw new Error('bad');
      if(UI.impMode==='restore'){
        if(!inc.admin||!inc.admin.pw)throw new Error('نەخێر');
        if(!confirm('هەموو داتای ئێستا بە داتای ئەم فایلە دەگۆڕدرێت. دڵنیایت؟'))return;
        const pe=DB.epoch;DB=Object.assign(baseDB(),inc);if(ONLINE){DB.epoch=Math.max(pe,DB.epoch||0)+1;DB.cfgStamp=Date.now()}save();toast('داتا گەڕێنرایەوە ✓');render();return;
      }
      const pristine=!DB.teachers.length&&!DB.students.length&&!DB.courses.length&&DB.cfgStamp===0;
      if(pristine&&DB.admin&&inc.lockedCopy){
        if(!confirm('ئەم ئامێرە وەک ئامێری مامۆستا ڕێکدەخرێت و بەشی سەرۆکی بەش لێرە ناچالاک دەبێت. بەردەوام دەبیت؟'))return;
        DB.admin=null;
      }
      const st=mergeIn(inc);
      toast('یەکخرا ✓ — '+st.added+' تۆمار زیاد، '+st.updated+' نوێکرایەوە'+(st.cfg?'، داتای بەش نوێکرایەوە':''));
      render();
    }catch(err){toast('فایلەکە دروست نییە یان بۆ ئەم کارە نابێت',true)}
  };
  rd.readAsText(file);
});

/* ================= میدتێرم + نمرەی کۆتایی ================= */
/* نمرەی میدتێرم وەک ڕێژە (٠–١٠٠) پاشەکەوت دەکرێت لەناو DB.grades بە type='midterm'، بۆیە بە هەمان هاوکاتکردن کار دەکات
   و ئەگەر ماوەی نمرەدانان یان نمرەی ئامانج بگۆڕێت، نمرە پاشەکەوتکراوەکان دروست دەمێننەوە. */
const PROF=[['solo','تەنها تیۆری'],['theory','تیۆری (لەگەڵ پراکتیکی)'],['practical','پراکتیکی (لەگەڵ تیۆری)']];
const profName=k=>(PROF.find(x=>x[0]===k)||['',k])[1];
const mkP=(mid,att,q,a,r,s)=>({mid,att,acts:{quiz:{w:q},assignment:{w:a},report:{w:r},seminar:{w:s}}});
const GC_DEF={total:50,rndMid:0,rndTot:0,attCut:[30,60,100],p:{solo:mkP(25,5,5,5,5,5),theory:mkP(10,2,4,2,2,0),practical:mkP(10,3,6,3,3,5)}};
function GCfg(){
  const u=(DB.settings&&DB.settings.gcfg)||{},up=u.p||{},P={};
  PROF.forEach(([k])=>{
    const d=GC_DEF.p[k],x=up[k]||{},acts={};
    GT.forEach(t=>{
      const xa=(x.acts||{})[t[0]]||{},w=xa.w!=null?+xa.w:d.acts[t[0]].w,raw=xa.raw>0?+xa.raw:null;
      acts[t[0]]={w,raw:raw==null?w:raw,rawSet:raw!=null};
    });
    P[k]={mid:x.mid!=null?+x.mid:d.mid,att:x.att!=null?+x.att:d.att,acts};
  });
  const ac=Array.isArray(u.attCut)&&u.attCut.length===3&&u.attCut.every(x=>x>=0&&x<=100)?u.attCut.map(Number):GC_DEF.attCut;
  return {total:u.total>0?+u.total:50,rndMid:+u.rndMid||0,rndTot:+u.rndTot||0,attCut:ac,p:P};
}
const r2=n=>Math.round(n*100)/100;
const rndTo=(v,st)=>st>0?Math.round(v/st)*st:v;
const profSum=P=>r2(P.mid+P.att+GT.reduce((t,x)=>t+P.acts[x[0]].w,0));
function gcErrors(C){
  const e=[],s=profSum(C.p.solo),d=r2(profSum(C.p.theory)+profSum(C.p.practical));
  if(Math.abs(s-C.total)>1e-9)e.push('وانەی تەنها تیۆری: کۆی بەشەکان '+num(s)+'ـە و دەبێت '+num(C.total)+' بێت');
  if(Math.abs(d-C.total)>1e-9)e.push('وانەی تیۆری+پراکتیکی: کۆی تیۆری ('+num(profSum(C.p.theory))+') + پراکتیکی ('+num(profSum(C.p.practical))+') = '+num(d)+' و دەبێت '+num(C.total)+' بێت');
  return e;
}
const profOf=c=>c.type==='practical'?'practical':(c.dual?'theory':'solo');
function pairOf(c){
  const nm=x=>String(x.name).trim();
  if(c.type==='practical')return DB.courses.find(x=>x.type==='theory'&&x.dual&&x.stage===c.stage&&nm(x)===nm(c))||null;
  if(c.dual)return DB.courses.find(x=>x.type==='practical'&&x.stage===c.stage&&nm(x)===nm(c))||null;
  return null;
}
const midConv=(p,P,C)=>r2(Math.min(P.mid,rndTo(p/100*P.mid,C.rndMid)));
const attCutOf=(a,C)=>a<=0?0:C.attCut[Math.min(a,C.attCut.length)-1];
const attVal=(a,P,C)=>r2(P.att*(1-attCutOf(a,C)/100));
function midIndex(){const ix={};liveGrades().forEach(g=>{if(g.type==='midterm')ix[g.courseId+'|'+g.sid]=g.score});return ix}
function mdScale(){let s=100;try{const v=parseFloat(localStorage.getItem('nurs_mscale'));if(v>0)s=v}catch(e){}return s}

/* ---------- نمرەی میدتێرم ---------- */
function mvText(raw){
  const G=UI.md,v=parseFloat(String(raw==null?'':raw).replace(',','.'));
  if(raw===undefined||raw===null||String(raw).trim()===''||isNaN(v))return '<span class="mut">—</span>';
  if(v<0||v>G.scale)return '<span style="color:var(--fail)">⚠️ دەرەوەی ماوەی نمرە</span>';
  const p=v/G.scale*100;
  return '<b>'+num(midConv(p,G.P,G.C))+' / '+num(G.P.mid)+'</b><small>'+num(r2(p))+'%</small>';
}
function mRow(s,i){
  const G=UI.md,v=G.vals[s.id];
  return '<tr><td class="n">'+(i+1)+'</td><td class="nm">'+esc(s.name)+'</td><td class="mut">'+esc(s.code)+'</td>'+
  '<td><input class="gin" type="number" step="any" min="0" max="'+G.scale+'" inputmode="decimal" dir="ltr" data-part="md" data-sid="'+s.id+'" value="'+esc(v==null?'':v)+'"></td>'+
  '<td class="mcell" id="mv-'+s.id+'">'+mvText(v)+'</td></tr>';
}
function midBody(){
  const courses=myCourses();
  if(!courses.length)return '<div class="card empty">'+(isAdmin()?'هیچ وانەیەک تۆمار نەکراوە. سەرەتا لە بەشی «وانەکان» وانە زیاد بکە.':'هیچ وانەیەکت بۆ دیاری نەکراوە. داوا لە سەرۆکی بەش بکە وانەکانت بۆ دیاری بکات.')+'</div>';
  const C=GCfg();
  const G=UI.md=UI.md||{courseId:'',group:'',scale:mdScale(),vals:{},key:null,dirty:false};
  if(!courses.some(c=>c.id===G.courseId)){G.courseId=courses[0].id;G.group=''}
  const c=getCourse(G.courseId);let groups=[];
  if(c.type==='practical'){groups=myGroups(c);if(!groups.includes(G.group))G.group=groups[0]||''}else G.group='';
  const P=C.p[profOf(c)];G.P=P;G.C=C;

  const key=G.courseId+'|'+G.group;

  liveGrades().forEach(g=>{if(g.courseId===c.id&&g.type==='midterm')cur[g.sid]=g});
  if(G.key!==key){G.vals={};list.forEach(s=>{if(cur[s.id])G.vals[s.id]=num(r2(cur[s.id].score*G.scale/100))});G.key=key;G.dirty=false}
  G.list=list;
  const saved=list.filter(s=>cur[s.id]).length;

  return '<div class="card"><div class="row"><label class="grow">وانە<select id="md-course" data-chg="md">'+courses.map(x=>'<option value="'+x.id+'"'+(x.id===c.id?' selected':'')+'>'+esc(x.name)+' — '+typeName(x.type)+' — '+stageName(x.stage)+'</option>').join('')+'</select></label>'+
  (c.type==='practical'?'<label>گروپ<select id="md-group" data-chg="md">'+groups.map(g=>'<option'+(g===G.group?' selected':'')+' value="'+esc(g)+'">'+esc(g)+'</option>').join('')+'</select></label>':'')+'</div></div>'+
  '<div class="datebar" style="background:linear-gradient(135deg,#7c3aed,#4f46e5)"><span class="dl">🧪 نمرەکان لەسەر چەند دەنووسیت؟</span>'+
  '<input type="number" id="md-scale" data-chg="md" step="any" min="1" dir="ltr" value="'+G.scale+'">'+
  '<span class="dn">← دەگۆڕدرێت بۆ نمرەی لەسەر '+num(P.mid)+'</span></div>'+
  '<div class="card"><div class="scl"><button class="btn sec" data-act="mdScale" data-s="100">لەسەر ١٠٠ بنووسە</button><button class="btn sec" data-act="mdScale" data-s="'+P.mid+'">ڕاستەوخۆ لەسەر '+num(P.mid)+' بنووسە (بێ گۆڕین)</button><button class="btn pri" data-act="saveMd" style="margin-right:auto">💾 پاشەکەوتکردنی نمرەکان</button></div>'+
  '<div class="chips"><span class="chip">کۆی خوێندکار: <b>'+list.length+'</b></span><span class="chip ok">تۆمارکراو: <b>'+saved+'</b></span><span class="chip">'+(c.type==='theory'?'تیۆری — '+stageName(c.stage):'پراکتیکی — گروپ '+esc(G.group))+'</span><span class="chip">دابەشکردن: <b>'+profName(profOf(c))+' — میدتێرم '+num(P.mid)+' نمرە</b></span></div>'+
  '<div class="hint">'+(direct?'ئێستا ماوەی نمرەدانان و نمرەی ئامانج یەکسانن ('+num(P.mid)+')، بۆیە هیچ گۆڕینێک ناکرێت. ':'هەر نمرەیەک لەسەر <b>'+num(G.scale)+'</b> بنووسیت خۆی بە ئۆتۆ دەگۆڕدرێت بۆ <b>'+num(P.mid)+'</b>: نمرە ÷ '+num(G.scale)+' × '+num(P.mid)+'. ')+
  (isAdmin()?'نمرەی ئامانج لە <a href="#" data-act="goCfg">دابەشکردنی نمرەی کۆتایی</a> دەگۆڕدرێت.':'نمرەی ئامانج سەرۆکی بەش دیاری دەکات.')+
  ' ئەگەر ماوەی نمرەدانان بگۆڕیت، ئەو نمرانەی نووسیوتن بە ڕێژە دەگۆڕدرێن. خانەی بەتاڵ تۆمار ناکرێت.</div></div>'+
  '<div class="card tbl"><table><thead><tr><th>#</th><th>ناوی خوێندکار</th><th>کۆد</th><th>نمرە (لەسەر '+num(G.scale)+')</th><th>نمرەی گۆڕدراو (لەسەر '+num(P.mid)+')</th></tr></thead><tbody>'+
  (list.map(mRow).join('')||'<tr><td colspan="5" class="empty">هیچ خوێندکارێک نییە'+(c.type==='practical'&&!groups.length?' — هیچ گروپێک بۆ ئەم وانەیە دیاری نەکراوە':'')+'</td></tr>')+'</tbody></table></div>';
}
function setMdScale(ns){
  const G=UI.md;
  if(!(ns>0)){toast('ماوەی نمرەدانان دەبێت ژمارەیەکی گەورەتر لە سفر بێت',true);return render()}
  if(G.dirty){const f=ns/G.scale;Object.keys(G.vals).forEach(id=>{const raw=String(G.vals[id]).trim().replace(',','.'),v=parseFloat(raw);if(raw!==''&&isFinite(v))G.vals[id]=num(r2(v*f))})}
  else G.key=null;
  G.scale=ns;try{localStorage.setItem('nurs_mscale',String(ns))}catch(e){}
  render();
}
CHG.md=el=>{
  const G=UI.md;
  if(el.id==='md-scale')return setMdScale(parseFloat(el.value));
  if(G.dirty&&!confirm('گۆڕانکارییەکانت پاشەکەوت نەکراون. بەردەوام دەبیت؟'))return render();
  const nc=$('#md-course').value;
  if(nc!==G.courseId){G.courseId=nc;G.group=''}else if($('#md-group'))G.group=$('#md-group').value;
  G.key=null;render();

ACTS.mdScale=a=>setMdScale(parseFloat(a.dataset.s));
INP.md=el=>{const G=UI.md;G.vals[el.dataset.sid]=el.value;G.dirty=true;const m=$('#mv-'+el.dataset.sid);if(m)m.innerHTML=mvText(el.value)};
ACTS.goCfg=(a,e)=>{if(e)e.preventDefault();UI.cfgOpen=true;UI.tab='final';render()};
ACTS.saveMd=()=>{
  const G=UI.md,c=getCourse(G.courseId);if(!c)return;
  if(!G.list.length){toast('هیچ خوێندکارێک نییە بۆ پاشەکەوتکردن',true);return}
  DB.grades=DB.grades||[];
  const ops=[];let bad=0;
  G.list.forEach(s=>{
    const raw=String(G.vals[s.id]==null?'':G.vals[s.id]).trim().replace(',','.');
    const g0={courseId:c.id,sid:s.id,type:'midterm',date:'midterm'};
    const i=DB.grades.findIndex(x=>gk(x)===gk(g0));
    if(raw===''){if(i>=0&&DB.grades[i].score!=null)ops.push({i,g0,score:null});return}
    const v=Number(raw);
    if(!isFinite(v)||v<0||v>G.scale+1e-9){bad++;return}
    ops.push({i,g0,score:Math.round(v/G.scale*100*1e4)/1e4});
  });
  if(bad){toast(bad+' نمرە دروست نییە — دەبێت ژمارە بێت و لە ٠ تا '+num(G.scale)+' بێت',true);return}
  const now=Date.now();let n=0;
  ops.forEach(o=>{
    if(o.score!=null)n++;
    if(o.i>=0){const g=DB.grades[o.i];g.score=o.score;g.savedBy=SESSION.name;g.savedAt=now}
    else DB.grades.push(Object.assign({id:uid(),score:o.score,savedBy:SESSION.name,savedAt:now},o.g0));
  });
  save();G.dirty=false;G.key=null;toast('نمرەی میدتێرم پاشەکەوت کرا ✓ ('+n+' نمرە)');render();
};

/* ---------- نمرەی کۆتایی ---------- */
function calcRow(c,s,C,ctx){
  const prof=profOf(c),P=C.p[prof],k=c.id+'|'+s.id,parts=[];
  if(P.mid>0){const p=ctx.mx[k];parts.push({k:'mid',label:'میدتێرم',w:P.mid,pct:p==null?null:p,val:p==null?null:midConv(p,P,C)})}
  GT.forEach(t=>{
    const a=P.acts[t[0]];if(!(a.w>0))return;
    const arr=(ctx.gx[k]||{})[t[0]],m=arr&&arr.length?meanOf(arr):null;
    parts.push({k:t[0],label:t[1],w:a.w,raw:a.raw,mean:m,n:arr?arr.length:0,val:m==null?null:r2(Math.min(a.w,m/a.raw*a.w))});
  });
  const ab=(ctx.ax[k]||[]).length;
  if(P.att>0)parts.push({k:'att',label:'غیابات',w:P.att,a:ab,val:attVal(ab,P,C),cut:attCutOf(ab,C)});
  const miss=parts.filter(p=>p.val==null).map(p=>p.label),max=profSum(P);
  const total=r2(Math.min(max,rndTo(r2(parts.reduce((t,p)=>t+(p.val||0),0)),C.rndTot)));
  return {s,c,prof,parts,miss,total,max,a:ab,st:status(ab)};
}
function finalRows(f){
  const C=GCfg(),ctx={ax:absIndex(),gx:gradeStats(),mx:midIndex()},q=(f.q||'').trim().toLowerCase(),out=[];
  myCourses().forEach(c=>{
    if(f.stage&&String(c.stage)!==String(f.stage))return;
    if(f.course&&c.id!==f.course)return;
    const pc=pairOf(c);
    courseStudents(c,null).forEach(s=>{
      if(q&&!(s.name.toLowerCase().includes(q)||String(s.code).toLowerCase().includes(q)))return;
      const r=calcRow(c,s,C,ctx);
      if(pc&&(pc.type!=='practical'||(pc.groupTeachers||{})[s.group])){
        const o=calcRow(pc,s,C,ctx);
        r.comb=r2(Math.min(C.total,r.total+o.total));r.combMax=r2(r.max+o.max);r.combMiss=o.miss.length>0;
      }
      out.push(r);
    });
  });
  return out;
}
function partNote(p){
  if(p.k==='mid')return num(r2(p.pct))+'%';
  if(p.k==='att')return p.a+' غیاب';
  return num(r2(p.mean))+' / '+num(p.raw)+(p.mean>p.raw?' <span class="w">⚠️</span>':'');
}
function partCell(p){
  if(!p)return '<td class="mcell"><span class="mut">·</span></td>';
  if(p.val==null)return '<td class="mcell"><span class="mut">—</span><small>لە '+num(p.w)+'</small></td>';
  return '<td class="mcell"><b>'+num(p.val)+'</b><small>'+partNote(p)+'</small><small>لە '+num(p.w)+'</small></td>';
}
function finalStatus(r){
  let h='';
  if(r.st==='fail')h+='<span class="badge fail">کەوتوو (غیاب)</span> ';
  else if(r.st==='warn')h+='<span class="badge warn">ئاگادارکراوەتەوە</span> ';
  if(r.miss.length)h+='<span class="badge warn" title="نمرەی نەدراو: '+esc(r.miss.join('، '))+'">ناتەواو</span>';
  return h||'<span class="badge ok">تەواو</span>';
}
const FKEYS=[['mid','میدتێرم']].concat(GT.map(t=>[t[0],t[1]]),[['att','غیابات']]);
function finalOut(rows){
  const C=GCfg(),keys=FKEYS.filter(k=>rows.some(r=>r.parts.some(p=>p.k===k[0]))),hasComb=rows.some(r=>r.comb!=null);
  const avg=rows.length?r2(rows.reduce((t,r)=>t+(r.comb!=null?r.comb:r.total),0)/rows.length):0,inc=rows.filter(r=>r.miss.length||r.combMiss).length;
  return '<div class="chips"><span class="chip">ڕیزەکان: <b>'+rows.length+'</b></span><span class="chip ok">ناوەندی کۆی گشتی: <b>'+num(avg)+' / '+num(C.total)+'</b></span><span class="chip warn">ناتەواو: <b>'+inc+'</b></span></div>'+
  '<div class="card tbl"><table><thead><tr><th>#</th><th>ناوی خوێندکار</th><th>کۆد</th><th>قۆناغ</th><th>گروپ</th><th>وانە</th>'+keys.map(k=>'<th>'+k[1]+'</th>').join('')+'<th>کۆی ئەم وانەیە</th>'+(hasComb?'<th>کۆی تیۆری + پراکتیکی<br><small>لە '+num(C.total)+'</small></th>':'')+'<th>دۆخ</th></tr></thead><tbody>'+
  (rows.map((r,i)=>'<tr class="clk" data-act="fdetail" data-sid="'+r.s.id+'" data-cid="'+r.c.id+'"><td class="n">'+(i+1)+'</td><td class="nm">'+esc(r.s.name)+'</td><td>'+esc(r.s.code)+'</td><td>'+r.s.stage+'</td><td>'+esc(r.s.group||'—')+'</td><td>'+esc(r.c.name)+'<small>'+typeName(r.c.type)+'</small></td>'+keys.map(k=>partCell(r.parts.find(p=>p.k===k[0]))).join('')+
    '<td class="mcell"><span class="tot">'+num(r.total)+'</span><small>لە '+num(r.max)+'</small></td>'+(hasComb?'<td class="mcell">'+(r.comb!=null?'<span class="tot">'+num(r.comb)+'</span><small>لە '+num(r.combMax)+'</small>':'<span class="mut">—</span>')+'</td>':'')+'<td>'+finalStatus(r)+'</td></tr>').join('')||'<tr><td colspan="'+(8+keys.length+(hasComb?1:0))+'" class="empty">هیچ ئەنجامێک نییە</td></tr>')+'</tbody></table></div>';
}
const gcNum=(form,n)=>{const v=parseFloat(String(form.elements[n].value).replace(',','.'));return isNaN(v)?0:v};
function gcSumHtml(form){
  const T=gcNum(form,'total'),S={};
  PROF.forEach(([k])=>{let s=gcNum(form,k+'_mid')+gcNum(form,k+'_att');GT.forEach(t=>{s+=gcNum(form,k+'_w_'+t[0])});S[k]=r2(s)});
  const ds=r2(S.theory+S.practical),c=(ok,t)=>'<span class="chip '+(ok?'sumok':'sumbad')+'">'+t+'</span> ';
  return c(Math.abs(S.solo-T)<1e-9,'تەنها تیۆری: '+num(S.solo)+' / '+num(T)+(Math.abs(S.solo-T)<1e-9?' ✓':''))+c(Math.abs(ds-T)<1e-9,'تیۆری + پراکتیکی: '+num(S.theory)+' + '+num(S.practical)+' = '+num(ds)+' / '+num(T)+(Math.abs(ds-T)<1e-9?' ✓':''));
}
function cfgCard(C,bad){
  const RND=[[0,'بێ خپکردنەوە'],[0.25,'نزیکترین ٠.٢٥'],[0.5,'نزیکترین ٠.٥'],[1,'نزیکترین ١']];
  const sel=(n,v)=>'<select name="'+n+'">'+RND.map(o=>'<option value="'+o[0]+'"'+(+v===o[0]?' selected':'')+'>'+o[1]+'</option>').join('')+'</select>';
  const inp=(n,v,l,extra)=>'<label>'+l+'<input name="'+n+'" type="number" step="any" min="0" dir="ltr" data-part="gcfg" value="'+v+'" required'+(extra||'')+'></label>';
  const prof=(k,P)=>'<div class="card" style="background:#f8fafc;padding:12px"><b>'+profName(k)+'</b> <span class="mut">— کۆ: '+num(profSum(P))+'</span><div class="cfgg">'+inp(k+'_mid',P.mid,'میدتێرم')+inp(k+'_att',P.att,'غیابات')+'</div><div class="cfgg">'+
    GT.map(t=>'<div class="gb"><b>'+t[1]+'</b>'+inp(k+'_w_'+t[0],P.acts[t[0]].w,'نمرە لە کۆتایی')+'<label>نمرەکان لەسەر چەندن<input name="'+k+'_r_'+t[0]+'" type="number" step="any" min="0.01" dir="ltr" data-part="gcfg" value="'+(P.acts[t[0]].rawSet?P.acts[t[0]].raw:'')+'" placeholder="وەک نمرەی بەش"></label></div>').join('')+'</div></div>';
  return '<div class="card no-print"><details class="cfg"'+(UI.cfgOpen||bad?' open':'')+'><summary>⚙️ دابەشکردنی نمرەی کۆتایی (کۆی گشتی '+num(C.total)+')</summary>'+
  '<form data-form="gcfg"><div class="cfgg">'+inp('total',C.total,'کۆی نمرەی کۆتایی',' min="1"')+'<label>خپکردنەوەی نمرەی میدتێرم'+sel('rndMid',C.rndMid)+'</label><label>خپکردنەوەی نمرەی کۆتایی'+sel('rndTot',C.rndTot)+'</label></div>'+
  '<b>کەمکردنەوەی نمرەی غیابات (% لە نمرەی غیاب)</b><div class="cfgg"><label>١ غیاب<input name="cut1" type="number" step="any" min="0" max="100" dir="ltr" value="'+C.attCut[0]+'" required></label><label>٢ غیاب<input name="cut2" type="number" step="any" min="0" max="100" dir="ltr" value="'+C.attCut[1]+'" required></label><label>٣ غیاب یان زیاتر<input name="cut3" type="number" step="any" min="0" max="100" dir="ltr" value="'+C.attCut[2]+'" required></label></div>'+
  PROF.map(([k])=>prof(k,C.p[k])).join('')+
  '<div class="row"><span id="gc-sum"></span><button class="btn pri">💾 پاشەکەوتکردن</button><button type="button" class="btn" data-act="gcDef">گەڕاندنەوەی ڕێکخستنی بنەڕەتی</button></div>'+
  '<div class="hint">«تەنها تیۆری» دەبێت کۆی ببێتە '+num(C.total)+'، و «تیۆری + پراکتیکی» پێکەوە دەبێت ببنە '+num(C.total)+'. «نمرەکان لەسەر چەندن» بەتاڵ بێت یانی هەمان نمرەی بەشەکەیە؛ ئەگەر کویزەکان لەسەر ١٠ن و بەشەکەی ٤یە، لێرە ١٠ بنووسە. بۆ لابردنی بەشێک نمرەکەی بکە ٠. وانەی تیۆری+پراکتیکی لە «وانەکان» بە دوو وانە دروست دەکرێت (هەمان ناو و قۆناغ) و لە وانەی تیۆری تیکی «پراکتیکیشی هەیە» دەکەیت.</div></form></details></div>';
}
function finalBody(){
  const R=UI.fn,C=GCfg(),cs=myCourses().filter(c=>!R.stage||String(c.stage)===String(R.stage));
  if(R.course&&!cs.some(c=>c.id===R.course))R.course='';
  const opt=(v,t,s)=>'<option value="'+v+'"'+(s===v?' selected':'')+'>'+t+'</option>';
  const errs=gcErrors(C),bad=errs.length>0;
  const warns=[];
  DB.courses.forEach(c=>{
    if(c.dual&&!pairOf(c))warns.push('وانەی «'+c.name+'» (تیۆری) پراکتیکیشی هەیە بەڵام وانەی پراکتیکی بە هەمان ناو و قۆناغ نەدۆزرایەوە.');
    if(c.type==='practical'&&!pairOf(c))warns.push('وانەی پراکتیکی «'+c.name+'» وانەیەکی تیۆری بە هەمان ناو و قۆناغ و تیکی «پراکتیکیشی هەیە»ی نییە، بۆیە تەنها لەسەر '+num(profSum(C.p.practical))+' هەژمار دەکرێت.');
  });
  const ps=k=>{const P=C.p[k];return 'میدتێرم '+num(P.mid)+GT.filter(t=>P.acts[t[0]].w>0).map(t=>' + '+t[1]+' '+num(P.acts[t[0]].w)).join('')+' + غیابات '+num(P.att)};
  setTimeout(()=>{const f=$('form[data-form="gcfg"]'),el=$('#gc-sum');if(f&&el)el.innerHTML=gcSumHtml(f)},0);
  return '<div class="print-only"><h2>'+esc(DB.settings.college)+' — '+esc(DB.settings.title)+'</h2><div>نمرەی کۆتایی ('+num(C.total)+') — '+today()+'</div></div>'+
  (bad?'<div class="alert no-print">⚠️ دابەشکردنی نمرەکان تەواو نییە:<br>'+errs.join('<br>')+'<br>'+(isAdmin()?'لە خوارەوە ڕێکی بخە.':'داوا لە سەرۆکی بەش بکە ڕێکی بخات.')+'</div>':'')+
  (isAdmin()&&warns.length?'<div class="alert no-print">'+warns.map(esc).join('<br>')+'</div>':'')+
  (isAdmin()?cfgCard(C,bad):'<div class="card no-print"><div class="chips" style="margin:0"><span class="chip">تەنها تیۆری: <b>'+ps('solo')+'</b></span><span class="chip">تیۆری: <b>'+ps('theory')+'</b></span><span class="chip">پراکتیکی: <b>'+ps('practical')+'</b></span></div></div>')+
  '<div class="card no-print"><div class="filters">'+
  '<label>قۆناغ<select data-chg="fn" data-k="stage">'+stageOptions(R.stage,true)+'</select></label>'+
  '<label>وانە<select data-chg="fn" data-k="course">'+opt('','هەموو وانەکان',R.course)+cs.map(c=>opt(c.id,esc(c.name)+' ('+typeName(c.type)+')',R.course)).join('')+'</select></label>'+
  '<label>گەڕان<input data-part="fn" data-k="q" value="'+esc(R.q)+'" placeholder="ناو یان کۆد"></label></div>'+
  '<div class="row"><button class="btn sec" data-act="fcsv">⬇️ دەرهێنان بۆ Excel (CSV)</button><button class="btn" data-act="print">🖨️ چاپکردن</button></div>'+
  '<div class="hint">هەموو نمرەکان خۆکارانە لە بەشەکانی تر دێن و کۆ دەکرێنەوە: <b>میدتێرم</b> (لە «نمرەی میدتێرم») + <b>چالاکییەکان</b> (mean ـی هەر جۆرێک لە «نمرەدانان») + <b>غیابات</b> (١ غیاب = '+C.attCut[0]+'% کەم دەکاتەوە، ٢ غیاب = '+C.attCut[1]+'%، ٣ غیاب یان زیاتر = '+C.attCut[2]+'% لە نمرەی غیاب). ئەگەر نمرەیەک نەدرابێت وەک ٠ هەژمار دەکرێت و «ناتەواو» پیشان دەدرێت. بۆ وانەی تیۆری+پراکتیکی، ستوونی «کۆی تیۆری + پراکتیکی» هەردوو بەشەکە کۆ دەکاتەوە. کلیک لەسەر ڕیزێک بکە بۆ بینینی هەژمارەکە.</div></div>'+
  '<div id="fn-out">'+finalOut(finalRows(R))+'</div>';
}
CHG.fn=el=>{UI.fn[el.dataset.k]=el.value;if(el.dataset.k==='stage')UI.fn.course='';render()};
INP.fn=el=>{UI.fn[el.dataset.k]=el.value;$('#fn-out').innerHTML=finalOut(finalRows(UI.fn))};
INP.gcfg=el=>{const s=$('#gc-sum');if(s)s.innerHTML=gcSumHtml(el.form)};
FORMS.gcfg=f=>{
  const g=n=>Number(String(f.elements[n].value).replace(',','.'));
  const total=g('total'),p={},sums={};
  let ok=total>0;
  PROF.forEach(([k])=>{
    const mid=g(k+'_mid'),att=g(k+'_att'),acts={};
    if(!(mid>=0&&att>=0))ok=false;
    let s=mid+att;
    GT.forEach(t=>{
      const w=g(k+'_w_'+t[0]),rs=String(f.elements[k+'_r_'+t[0]].value).trim(),raw=rs===''?null:Number(rs.replace(',','.'));
      if(!(w>=0)||(raw!==null&&!(raw>0)))ok=false;
      acts[t[0]]={w,raw};s+=w;
    });
    p[k]={mid,att,acts};sums[k]=r2(s);
  });
  if(!ok){toast('ژمارەکان دروست نین (نمرەکان نابێت سالب بن و «لەسەر چەندن» دەبێت گەورەتر لە ٠ بێت)',true);return}
  if(Math.abs(sums.solo-total)>1e-9){toast('وانەی تەنها تیۆری: کۆ '+num(sums.solo)+'ـە و دەبێت '+num(total)+' بێت',true);return}
  const ds=r2(sums.theory+sums.practical);
  if(Math.abs(ds-total)>1e-9){toast('تیۆری + پراکتیکی: کۆ '+num(ds)+'ـە و دەبێت '+num(total)+' بێت',true);return}
  const attCut=[g('cut1'),g('cut2'),g('cut3')];
  if(!attCut.every(x=>x>=0&&x<=100)){toast('ڕێژەی کەمکردنەوەی غیاب دەبێت لە ٠ تا ١٠٠ بێت',true);return}
  DB.settings.gcfg={total,attCut,rndMid:+f.elements.rndMid.value,rndTot:+f.elements.rndTot.value,p};
  UI.cfgOpen=false;cfg();toast('دابەشکردنی نمرەکان پاشەکەوت کرا ✓');render();
};
ACTS.gcDef=()=>{if(!confirm('دابەشکردنی نمرەکان دەگەڕێتەوە بۆ ڕێکخستنی بنەڕەتی. دڵنیایت؟'))return;delete DB.settings.gcfg;UI.cfgOpen=true;cfg();render()};
ACTS.fcsv=()=>{
  const C=GCfg(),rows=finalRows(UI.fn),keys=FKEYS.filter(k=>rows.some(r=>r.parts.some(p=>p.k===k[0])));
  const h=['#','ناوی خوێندکار','کۆد','قۆناغ','گروپ','وانە','جۆر'];
  keys.forEach(k=>h.push(k[1]));h.push('کۆی ئەم وانەیە','لە','کۆی تیۆری + پراکتیکی','ژمارەی غیاب','دۆخ');
  const out=[h].concat(rows.map((r,i)=>[i+1,r.s.name,r.s.code,r.s.stage,r.s.group||'',r.c.name,typeName(r.c.type)].concat(keys.map(k=>{const p=r.parts.find(x=>x.k===k[0]);return p&&p.val!=null?p.val:''}),[r.total,r.max,r.comb!=null?r.comb:'',r.a,(r.st==='fail'?'کەوتوو (غیاب)':r.st==='warn'?'ئاگادارکراوەتەوە':'ئاسایی')+(r.miss.length?' — ناتەواو':'')])));
  download('final-grades-'+stamp()+'.csv',toCSV(out),'text/csv;charset=utf-8');
};
ACTS.fdetail=a=>{
  const C=GCfg(),r=finalRows({}).find(x=>x.s.id===a.dataset.sid&&x.c.id===a.dataset.cid);if(!r)return;
  const lines=r.parts.map(p=>{
    let f;
    if(p.val==null)f='<span class="mut">نمرەی نەدراوە — وەک ٠ هەژمار دەکرێت</span>';
    else if(p.k==='mid')f=num(r2(p.pct))+'% × '+num(p.w)+' ÷ ١٠٠ = <b>'+num(p.val)+'</b>';
    else if(p.k==='att')f=p.a+' غیاب ← کەمکردنەوەی '+num(p.cut)+'% : '+num(p.w)+' × (١٠٠% − '+num(p.cut)+'%) = <b>'+num(p.val)+'</b>';
    else f='mean '+num(r2(p.mean))+' ('+p.n+' نمرە) ÷ '+num(p.raw)+' × '+num(p.w)+' = <b>'+num(p.val)+'</b>'+(p.mean>p.raw?' <span style="color:var(--warn)">⚠️ mean لە '+num(p.raw)+' زیاترە — بە زۆرترین نمرە سنووردار کرا</span>':'');
    return '<p style="margin-bottom:2px"><b>'+p.label+'</b> <span class="mut">(لە '+num(p.w)+')</span></p><div class="fm">'+f+'</div>';
  }).join('');
  modal('<h3>'+esc(r.s.name)+'</h3><p class="mut">'+esc(r.c.name)+' ('+typeName(r.c.type)+') — '+profName(r.prof)+'</p>'+lines+'<hr style="border:0;border-top:1px solid var(--bd)"><p style="margin:6px 0 0"><b>کۆی ئەم وانەیە:</b> <span class="tot">'+num(r.total)+'</span> / '+num(r.max)+'</p>'+(r.comb!=null?'<p style="margin:4px 0 0"><b>کۆی تیۆری + پراکتیکی:</b> <span class="tot">'+num(r.comb)+'</span> / '+num(r.combMax)+'</p>':''));
};

/* ================= ئۆنلاین (Google Sheet) ================= */
const KEY2='nursing_online_cache_v1',SYNC={st:'',t:''};
let LOADED=!ONLINE,QUIET=false,PENDING=false,CHG_N=0,syncBusy=false,syncAgain=false,syncT=null;
function syncText(){return SYNC.st==='busy'?'⏳ هاوکاتکردن...':SYNC.st==='ok'?'✓ هاوکات کرا '+SYNC.t:SYNC.st==='err'?'⚠️ پەیوەندی نییە — دووبارە هەوڵ دەدرێتەوە':''}
function syncHTML(){return '<span class="syn" id="syncst">'+syncText()+'</span><button class="btn ghost" data-act="resync" title="هاوکاتکردن">🔄</button>'}
function setSync(st){SYNC.st=st;if(st==='ok'){const d=new Date();SYNC.t=pad(d.getHours())+':'+pad(d.getMinutes())}const el=$('#syncst');if(el)el.textContent=syncText()}
async function api(body){
  const ac=typeof AbortController!=='undefined'?new AbortController():null,tm=ac&&setTimeout(()=>ac.abort(),40000);
  try{
    const r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body),signal:ac?ac.signal:undefined});
    const t=await r.text();
    try{return JSON.parse(t)}catch(e){const er=new Error('BADRESP');er.snip=t.slice(0,80);throw er}
  }finally{if(tm)clearTimeout(tm)}
}
function netMsg(e){
  if(e&&e.message==='BADRESP')return 'سێرڤەر وەڵامێکی هەڵەی دایەوە — لە Apps Script: Deploy ▸ Manage deployments ▸ Who has access دەبێت «Anyone» بێت، و دوای هەر گۆڕانکارییەک وەشانی نوێ (New version) دابنێ';
  if(e&&e.name==='AbortError')return 'سێرڤەر درەنگ وەڵامی دایەوە — دووبارە هەوڵبدەرەوە';
  return 'پەیوەندی بە سێرڤەرەوە نەکرا (Failed to fetch) — ئینتەرنێت یان لینکی API_URL بپشکنە';
}
function pushSoon(d){if(!ONLINE||!SESSION||SESSION.role==='guest')return;clearTimeout(syncT);syncT=setTimeout(doSync,d||1200)}
function storeSess(){try{sessionStorage.setItem('nurs_sess',JSON.stringify(SESSION))}catch(e){}}
async function doSync(){
  if(!ONLINE||!SESSION||SESSION.role==='guest')return;
  if(syncBusy){syncAgain=true;return}
  syncBusy=true;setSync('busy');const n=CHG_N;
  try{
    const first=!LOADED;
    const payload=first?null:(isAdmin()?DB:{epoch:DB.epoch,cfgStamp:DB.cfgStamp,records:DB.records,grades:DB.grades||[]});
    const res=await api({action:first?'login':'sync',u:SESSION.u,ph:SESSION.ph,db:payload});
    if(!res.ok){
      if(res.error==='auth'){toast('ناوی بەکارهێنەر یان پاسۆرد گۆڕدراوە — دووبارە بچۆرە ژوورەوە',true);ACTS.logout();return}
      throw new Error(res.error||'server');
    }
    if(first){DB=Object.assign(baseDB(),res.db);LOADED=true;QUIET=true;save();QUIET=false;render()}
    else{
      if(isAdmin()&&payload&&payload.admin&&payload.admin.pw&&(payload.admin.pw!==SESSION.ph||payload.admin.username!==SESSION.u)){SESSION.u=String(payload.admin.username).toLowerCase();SESSION.ph=payload.admin.pw;storeSess()}
      QUIET=true;const st=mergeIn(res.db);QUIET=false;
      const ae=document.activeElement,busy=(UI.att&&UI.att.dirty)||(UI.gr&&UI.gr.dirty)||(UI.md&&UI.md.dirty)||$('#modal').innerHTML||(ae&&/INPUT|SELECT|TEXTAREA/.test(ae.tagName));
      if((st.added||st.updated||st.cfg)&&!busy)render();
    }
    if(CHG_N===n)PENDING=false;
    setSync('ok');
  }catch(e){QUIET=false;setSync('err')}
  finally{syncBusy=false;if(syncAgain){syncAgain=false;pushSoon(400)}}
}
ACTS.resync=()=>{doSync()};
async function onlineLogin(f,u,p){
  const b=f.querySelector('button'),old=b.textContent;b.disabled=true;b.textContent='⏳ ...';
  try{
    const ph=H(p),res=await api({action:'login',u,ph});
    if(!res.ok){toast(res.error==='auth'?'ناوی بەکارهێنەر یان پاسۆرد هەڵەیە':'هەڵەی سێرڤەر: '+res.error,true);return}
    DB=Object.assign(baseDB(),res.db);LOADED=true;
    SESSION={role:res.role,id:res.id,name:res.name,u,ph};storeSess();
    UI.tab=isAdmin()?'home':'attend';UI.att=null;UI.gr=null;UI.md=null;
    QUIET=true;save();QUIET=false;setSync('ok');render();
  }catch(e){toast(netMsg(e),true)}
  finally{if(b.isConnected){b.disabled=false;b.textContent=old}}
}
async function onlineLookup(f,code){
  const b=f.querySelector('button'),old=b.textContent;b.disabled=true;b.textContent='⏳';
  try{
    const res=await api({action:'student',code});
    if(res.ok){DB=Object.assign(baseDB(),res.db);UI.gs=res.student;UI.gmsg=''}
    else{UI.gs=null;UI.gmsg=res.error==='notfound'?'ئەم کۆدە نەدۆزرایەوە. دڵنیابەرەوە لە کۆدی خوێندکاری.':'هەڵەی سێرڤەر: '+res.error}
    render();
  }catch(e){UI.gs=null;UI.gmsg='پەیوەندی بە سێرڤەرەوە نەکرا. ئینتەرنێتەکەت بپشکنە.';render()}
}
function bootOnline(){
  DB=baseDB();
  try{
    const s=JSON.parse(sessionStorage.getItem('nurs_sess')||'null');
    if(s&&s.ph&&(s.role==='admin'||s.role==='teacher')){
      SESSION=s;
      const c=JSON.parse(localStorage.getItem(KEY2)||'null');
      if(c){DB=Object.assign(baseDB(),c);LOADED=true}
    }
  }catch(e){}
  render();
  if(SESSION)doSync();
  setInterval(()=>{if(SESSION&&SESSION.role!=='guest'&&!document.hidden)doSync()},45000);
  window.addEventListener('beforeunload',e=>{if(PENDING&&SESSION&&SESSION.role!=='guest'){e.preventDefault();e.returnValue=''}});
}

/* ================= دەستپێکردن ================= */
function boot(){
  if(ONLINE)return bootOnline();
  let snap=null;
  try{const t=$('#snapdata').textContent.trim();if(t)snap=JSON.parse(t)}catch(e){}
  if(snap&&snap.studentOnly){STUDENT_ONLY=true;DB=Object.assign(baseDB(),snap);SESSION={role:'guest'}}
  else{
    DB=loadLS();
    if(!DB)DB=snap?baseDB():freshDB();
    DB=Object.assign(baseDB(),DB);
    if(snap)mergeIn(snap);
    save();
    try{
      const s=JSON.parse(sessionStorage.getItem('nurs_sess')||'null');
      if(s&&s.role==='admin'&&DB.admin)SESSION=s;
      else if(s&&s.role==='teacher'){const t=getTeacher(s.id);if(t)SESSION={role:'teacher',id:t.id,name:t.name}}
    }catch(e){}
  }
  render();
}
boot();
